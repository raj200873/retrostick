name: Build RetroStick Image

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Fix Hidden Docker Configurations
      run: |
        find . -type f -exec sed -i 's/apt update && apt upgrade -y/apt-get update/g' {} +
        find . -type f -exec sed -i 's/apt-get update && apt-get upgrade -y/apt-get update/g' {} +

    - name: Run Build Script
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Pack RootFS Image
      run: |
        dd if=/dev/zero of=retrostick_rootfs.img bs=1M count=512
        if [ -d "rootfs" ]; then
          mkfs.ext4 -F -d rootfs/ retrostick_rootfs.img
        elif [ -d "output" ]; then
          mkfs.ext4 -F -d output/ retrostick_rootfs.img
        else
          mkfs.ext4 -F retrostick_rootfs.img
        fi

    - name: Upload Finished Image File
      uses: actions/upload-artifact@v4
      with:
        name: RetroStick-Image
        path: retrostick_rootfs.img

