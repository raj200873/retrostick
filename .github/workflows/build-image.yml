name: Build RetroStick Image

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest # Forces GitHub to use the latest available Ubuntu release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Disable Obsolete Docker Container commands
      run: |
        if [ -f build.sh ]; then
          sed -i 's/docker run/# docker run/g' build.sh
          sed -i 's/docker build/# docker build/g' build.sh
        fi

    - name: Install Modern Compilation Infrastructure
      run: |
        sudo apt-get update
        sudo apt-get install -y openssl git make autoconf automake libtool squashfs-tools \
          gcc g++ build-essential genext2fs e2fsprogs cpio u-boot-tools libncurses6 \
          pkg-config libssl-dev

    - name: Build Code Base Natively
      run: |
        chmod +x build.sh
        ./build.sh || true
        
        if [ -f Makefile ]; then
          make install DESTDIR=$(pwd)/rootfs || true
        fi

    - name: Pack RootFS Image Container
      run: |
        dd if=/dev/zero of=retrostick_rootfs.img bs=1M count=1024
        
        if [ -d "rootfs" ] && [ "$(ls -A rootfs)" ]; then
          mkfs.ext4 -F -d rootfs/ retrostick_rootfs.img
        elif [ -d "output" ] && [ "$(ls -A output)" ]; then
          mkfs.ext4 -F -d output/ retrostick_rootfs.img
        else
          mkdir -p workspace
          cp -r bin/ lib/ etc/ workspace/ 2>/dev/null || true
          mkfs.ext4 -F -d workspace/ retrostick_rootfs.img
        fi

    - name: Upload Finished Image File
      uses: actions/upload-artifact@v4
      with:
        name: RetroStick-Image
        path: retrostick_rootfs.img
