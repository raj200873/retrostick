name: Build RetroStick Image

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Fix Broken APT Inside Docker Build
      run: |
        # This fixes the exit code 100 error by swapping the old Debian/Ubuntu URLs 
        # to active archive servers before the build script triggers 'apt update'
        if [ -f Dockerfile ]; then
          sed -i 's/deb.debian.org/archive.debian.org/g' Dockerfile
          sed -i 's/security.debian.org/archive.debian.org/g' Dockerfile
          sed -i '/apt upgrade -y/d' Dockerfile
        fi

    - name: Run Build Script
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Pack RootFS Image
      run: |
        # Creates a raw 512MB ext4 partition image from the compiled rootfs folder
        dd if=/dev/zero of=retrostick_rootfs.img bs=1M count=512
        mkfs.ext4 -F -d rootfs/ retrostick_rootfs.img

    - name: Upload Finished Image File
      uses: actions/upload-artifact@v4
      with:
        name: RetroStick-Image
        path: retrostick_rootfs.img
