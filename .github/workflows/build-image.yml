name: Build RetroStick Image

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 # Using a highly stable, compatible Ubuntu release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make gcc g++ build-essential genext2fs e2fsprogs cpio u-boot-tools libncurses5-dev

    - name: Compile RetroArch and System Files
      run: |
        # Bypass the repository's docker wrapper and call make targets natively
        cd src
        make all

    - name: Pack RootFS Image
      run: |
        # Creates a raw 512MB ext4 partition image from the newly compiled rootfs folder
        dd if=/dev/zero of=retrostick_rootfs.img bs=1M count=512
        mkfs.ext4 -F -d rootfs/ retrostick_rootfs.img

    - name: Upload Finished Image File
      uses: actions/upload-artifact@v4
      with:
        name: RetroStick-Image
        path: retrostick_rootfs.img
